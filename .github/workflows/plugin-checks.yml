name: Plugin checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  plugin-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for merge-base anti-weaken + extraction checks on PRs.
          fetch-depth: 0

      - name: Install check dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Check plugin catalog
        run: python3 scripts/check-plugin-catalog.py

      - name: Lint plugin content
        run: python3 scripts/check-plugin-content.py

      - name: Test plugin content linter
        run: python3 scripts/test_check_plugin_content.py

      - name: Test plugin catalog checker
        run: python3 scripts/test_check_plugin_catalog.py

      - name: Check Codex marketplace metadata
        run: python3 scripts/sync-codex-marketplace.py --check

      - name: Check saas-startup-team workflow aliases
        run: python3 plugins/saas-startup-team/scripts/generate_workflow_aliases.py --check

      - name: Check legal-verdict-gate.sh copies match (saas-startup-team, lawyer)
        run: cmp plugins/saas-startup-team/scripts/legal-verdict-gate.sh plugins/lawyer/scripts/legal-verdict-gate.sh

      - name: Check shared operations scripts match (saas-startup-team, saas-operations)
        run: |
          cmp plugins/saas-startup-team/scripts/pii-gate.sh plugins/saas-operations/scripts/pii-gate.sh
          cmp plugins/saas-startup-team/scripts/issue-file.sh plugins/saas-operations/scripts/issue-file.sh

      - name: saas-operations tests
        run: bash plugins/saas-operations/tests/run-tests.sh

      - name: Plugin LOC budgets
        run: |
          set -euo pipefail
          CHECKER=plugins/saas-startup-team/scripts/check_loc_budget.py
          for PLUGIN in plugins/saas-startup-team plugins/saas-operations; do
            BUDGET=$PLUGIN/integrity/loc-budget.json
            EXTRA=()
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags origin "${{ github.base_ref }}"
              MERGE_BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
              EXTRA+=(--git-base "$MERGE_BASE" --repo-root .)
              if git cat-file -e "$MERGE_BASE:$BUDGET" 2>/dev/null; then
                tmp=$(mktemp)
                git show "$MERGE_BASE:$BUDGET" > "$tmp"
                EXTRA+=(--compare-base "$tmp")
                python3 "$CHECKER" --plugin-root "$PLUGIN" --budget "$BUDGET" "${EXTRA[@]}"
                rm -f "$tmp"
              else
                python3 "$CHECKER" --plugin-root "$PLUGIN" --budget "$BUDGET" "${EXTRA[@]}"
              fi
            else
              python3 "$CHECKER" --plugin-root "$PLUGIN" --budget "$BUDGET"
            fi
          done

      - name: saas-startup-team LOC budget tests
        run: python3 -m unittest discover -s plugins/saas-startup-team/tests/loc-budget -p 'test_*.py' -v
